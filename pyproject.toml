[project]
name = "ai-engineer-core-track"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "google-genai>=2.22.0",
    "gradio>=6.28.0",
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
    "langchain-openai>=1.6.2",
    "litellm>=1.83.0",
    "openai>=3.8.0",
    "protobuf>=7.36.1",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
    "sentencepiece==0.2.0",
]

[project.scripts]
ai-engineer-core-track = "ai_engineer_core_track:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"
